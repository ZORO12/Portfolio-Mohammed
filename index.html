    #icons {
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      height: 100%;
      gap: 4px;
      padding: 8px;
      align-content: flex-start
    }

    .icon {
      width: 84px;
      padding: 6px 2px;
      background: none;
      border: 1px solid transparent;
      border-radius: 3px;
      color: #fff;
      text-shadow: 0 1px 3px #000;
      font: inherit;
      cursor: default
    }

    .icon i {
      display: block;
      font-size: 34px;
      font-style: normal
    }

    .icon:hover {
      background: rgba(255, 255, 255, .2);
      border-color: rgba(255, 255, 255, .4)
    }

    .icon:focus-visible,
    .icon.sel {
      background: rgba(80, 140, 220, .5);
      border-color: #9cf;
      outline: none
    }

    .win {
      position: absolute;
      display: flex;
      flex-direction: column;
      width: min(720px, 94vw);
      height: min(480px, 70vh);
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, .75);
      border-radius: 8px;
      padding: 0 6px 6px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(0, 0, 0, .3);
      animation: pop .18s ease-out
    }

    .win.min {
      display: none
    }

    .win.max {
      left: 0 !important;
      top: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border-radius: 0
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(.92)
      }
    }

    .tb {
      display: flex;
      align-items: center;
      height: 30px;
      cursor: move;
      color: #fff;
      text-shadow: 0 0 8px #fff, 0 0 3px #000;
      font-size: 12px;
      user-select: none
    }

    .tb span {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis
    }

    .tb button {
      width: 26px;
      height: 18px;
      margin-left: 2px;
      border: 1px solid rgba(0, 0, 0, .5);
      border-radius: 3px;
      background: linear-gradient(#e5eefb, #9bb8e3 50%, #7da1d4 51%, #b7d1f2);
      color: #123;
      font-size: 11px;
      padding: 0;
      cursor: pointer
    }

    .tb button:hover {
      filter: brightness(1.15)
    }

    .tb .x {
      width: 42px;
      background: linear-gradient(#f4b8a8, #d05a3e 50%, #b8381a 51%, #e58a6b);
      color: #fff
    }

    .body {
      flex: 1;
      overflow: auto;
      background: #fff;
      border: 1px solid rgba(0, 0, 0, .4);
      padding: 14px;
      line-height: 1.5
    }

    .body h2 {
      margin: 0 0 8px;
      font-size: 18px;
      color: #1e3f7a;
      font-weight: 400
    }

    .body h3 {
      margin: 14px 0 4px;
      font-size: 13px;
      color: #1e3f7a;
      border-bottom: 1px solid #c9d7ee
    }

    .body a {
      color: #0b5cc0
    }

    .body :focus-visible,
    #orb:focus-visible,
    button:focus-visible,
    summary:focus-visible {
      outline: 2px solid #f90;
      outline-offset: 1px
    }

    .btn {
      padding: 4px 14px;
      border: 1px solid #707070;
      border-radius: 3px;
      background: linear-gradient(#f2f2f2, #ebebeb 50%, #dddddd 51%, #cfcfcf);
      cursor: pointer;
      font: inherit;
      color: #000;
      text-decoration: none;
      display: inline-block
    }

    .btn:hover {
      border-color: #3c7fb1;
      background: linear-gradient(#eaf6fd, #d9f0fc 50%, #bee6fd 51%, #a7d9f5)
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .chip {
      border: 1px solid #b8c8e2;
      background: linear-gradient(#fff, #e8f0fb);
      border-radius: 3px;
      padding: 2px 8px
    }

    .chip:before {
      content: "⚙ ";
      font-size: 10px
